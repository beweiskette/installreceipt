[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "installreceipt"
version = "0.1.0"
description = "Compare MSI installation changes and uninstall residue from Windows Sandbox snapshots"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
installreceipt = "installreceipt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
installreceipt = ["scripts/*.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires Docker or a Chromium browser"]

[project.urls]
Repository = "https://github.com/beweiskette/installreceipt"
